<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player - Localhost</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
        }
        
        .player-section {
            flex: 1;
            min-width: 300px;
            padding: 30px;
        }
        
        .playlist-section {
            width: 350px;
            background: #f8f9fa;
            padding: 30px;
            border-left: 1px solid #e0e0e0;
            max-height: 600px;
            overflow-y: auto;
        }
        
        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .controls {
            margin-top: 20px;
        }
        
        .url-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .channel-list {
            list-style: none;
        }
        
        .channel-item {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .channel-item:hover {
            transform: translateX(5px);
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        
        .channel-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .channel-name {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .channel-url {
            font-size: 0.85em;
            opacity: 0.7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .status {
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        @media (max-width: 768px) {
            .playlist-section {
                width: 100%;
                border-left: none;
                border-top: 1px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 IPTV Player</h1>
            <p class="subtitle">Stream your favorite channels on localhost</p>
        </header>
        
        <div class="content">
            <div class="player-section">
                <video id="videoPlayer" controls>
                    Your browser does not support the video tag.
                </video>
                
                <div class="controls">
                    <div class="url-input-group">
                        <input type="text" id="streamUrl" placeholder="Enter stream URL (M3U8, MP4, etc.)">
                        <button onclick="loadCustomStream()">Load</button>
                    </div>
                    <button onclick="loadPlaylist()">Load Playlist</button>
                </div>
                
                <div id="status"></div>
            </div>
            
            <div class="playlist-section">
                <h2 style="margin-bottom: 20px; color: #333;">Sample Channels</h2>
                <ul class="channel-list" id="channelList"></ul>
            </div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const streamUrl = document.getElementById('streamUrl');
        const channelList = document.getElementById('channelList');
        const status = document.getElementById('status');
        
        // Sample IPTV channels (public test streams)
        const channels = [
            {
                name: "Big Buck Bunny",
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
            },
            {
                name: "Demo Stream 1",
                url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"
            },
            {
                name: "Sample Video",
                url: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            }
        ];
        
        function showStatus(message, type = 'info') {
            status.innerHTML = message;
            status.className = `status ${type}`;
            setTimeout(() => {
                status.innerHTML = '';
                status.className = 'status';
            }, 5000);
        }
        
        function loadStream(url) {
            if (!url) {
                showStatus('Please provide a valid stream URL', 'error');
                return;
            }
            
            videoPlayer.src = url;
            videoPlayer.load();
            videoPlayer.play().then(() => {
                showStatus('Stream loaded successfully!', 'success');
            }).catch(err => {
                showStatus('Error loading stream: ' + err.message, 'error');
                console.error('Playback error:', err);
            });
        }
        
        function loadCustomStream() {
            const url = streamUrl.value.trim();
            loadStream(url);
        }
        
        function loadPlaylist() {
            fetch('playlist.m3u')
                .then(response => response.text())
                .then(data => {
                    parseM3U(data);
                    showStatus('Playlist loaded successfully!', 'success');
                })
                .catch(err => {
                    showStatus('Error loading playlist: Using default channels', 'info');
                    console.error('Playlist load error:', err);
                    renderChannels(channels);
                });
        }
        
        function parseM3U(data) {
            const lines = data.split('\n');
            const parsedChannels = [];
            let currentChannel = {};
            
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    currentChannel.name = nameMatch ? nameMatch[1] : 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    parsedChannels.push({...currentChannel});
                    currentChannel = {};
                }
            }
            
            if (parsedChannels.length > 0) {
                renderChannels(parsedChannels);
            } else {
                renderChannels(channels);
            }
        }
        
        function renderChannels(channelData) {
            channelList.innerHTML = '';
            channelData.forEach((channel, index) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-url">${channel.url}</div>
                `;
                li.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    li.classList.add('active');
                    loadStream(channel.url);
                };
                channelList.appendChild(li);
            });
        }
        
        // Initialize with default channels
        renderChannels(channels);
        
        // Auto-load first channel on page load
        if (channels.length > 0) {
            showStatus('Ready to stream! Select a channel or enter a custom URL.', 'success');
        }
        
        // Handle stream URL input on Enter key
        streamUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadCustomStream();
            }
        });
    </script>
</body>
</html>
